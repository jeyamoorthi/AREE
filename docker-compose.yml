# AREE — backend (FastAPI, direct engine) and frontend (Next.js).
#
#   docker compose up --build      backend :8000/docs · frontend :3000
#
# WHAT CHANGED FROM THE PREVIOUS VERSION
#   The frontend was built with `NEXT_PUBLIC_API_URL: http://localhost:8000`.
#   That is compiled into the client bundle, so every visitor's browser fetched
#   THEIR OWN localhost — working only for someone browsing on the Docker host.
#   The frontend is now same-origin and reaches the API through the Next rewrite,
#   which resolves AREE_API_ORIGIN at run time inside the container network.
#
#   The backend also gained a persistent volume: SQLite needs a real filesystem,
#   and without one every restart discarded the observations the live forecast
#   depends on.

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      # args:
      #   INSTALL_STREAMING: "1"   # the Pathway stack. UNVERIFIED pins.
    ports:
      # Published for direct API access and debugging. The frontend does NOT use this
      # route — it reaches the backend over the compose network as http://backend:8000.
      - "8000:8000"
    environment:
      PORT: "8000"
      AREE_ENGINE_MODE: direct
      AREE_DB_PATH: /app/data/aree.db
      # SECRETS — set these in .env, never here.
      #   AREE_JWT_SECRET   a long random string. Unset means a random key per
      #                     process, so tokens die on restart.
      #   AREE_OPERATORS    user:role:pbkdf2hash;user:role:pbkdf2hash
      #                     Unset means demo operators with random passwords,
      #                     printed to the log and valid for that process only.
      AREE_JWT_SECRET: ${AREE_JWT_SECRET:-}
      AREE_OPERATORS: ${AREE_OPERATORS:-}
    env_file:
      - .env
    volumes:
      # The store. Seeded on first run from the committed 1 MB fixture so replay
      # works immediately; live builds up as the hourly capture runs.
      - aree-data:/app/data
      # Uploaded policy documents, so they survive a restart.
      - ./backend/policies:/app/backend/policies
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Empty on purpose: the browser talks to this server's own origin and the
        # rewrite below forwards it. See the note at the top of this file.
        NEXT_PUBLIC_API_URL: ""
        # BUILD arg, not just runtime. Next freezes rewrite destinations into
        # .next/routes-manifest.json during `next build`, so a value supplied only to
        # the running container is ignored. Service name, not localhost — inside this
        # container localhost is the frontend itself.
        AREE_API_ORIGIN: "http://backend:8000"
        # From the root .env, which compose interpolates automatically. The frontend
        # still has no env_file — this is one named, public basemap key passed
        # explicitly, not the secret set. Absent from .env it resolves to empty and
        # the maps render watermarked instead of failing.
        NEXT_PUBLIC_CARTO_KEY: "${NEXT_PUBLIC_CARTO_KEY:-}"
    ports:
      - "3000:3000"
    environment:
      # Resolved inside the compose network at run time, not baked into the
      # bundle. This is the whole difference between a demo that works for
      # everyone and one that works only on the host machine.
      AREE_API_ORIGIN: http://backend:8000
    depends_on:
      backend:
        # The engine takes a while to load its models, and the frontend prerenders its
        # static pages on boot. Waiting for healthy means that prerender has an API to
        # talk to instead of failing and leaving the first paint empty.
        condition: service_healthy
    healthcheck:
      # node:22-slim ships neither curl nor wget; Node 22 has global fetch.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  aree-data:
