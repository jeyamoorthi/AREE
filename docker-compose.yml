# AREE — backend (Pathway engine + FastAPI) and frontend (Next.js).
#
# The backend runs in Linux where Pathway's wheels exist. Start with:
#   docker compose up --build
#
# Secrets come from the root .env (WAQI_TOKEN, FIRMS_API_KEY, GEMINI_API_KEY).
# They are never passed to the frontend image.
#
# HOW THE BROWSER REACHES THE API
#   Through the Next.js server, same-origin, never directly. The frontend rewrites
#   /api and /ws to AREE_API_ORIGIN (see frontend/next.config.ts), so one published
#   port carries the whole application and the API is not exposed as a second origin
#   the browser has to know about.
#
#   This compose file used to bake NEXT_PUBLIC_API_URL=http://localhost:8000 into the
#   client bundle instead. That names a host the VIEWER's browser must resolve, so it
#   worked only for someone sitting at the machine running Docker; over a LAN or a
#   tunnel every visitor's browser called its own localhost. It also broke server-side
#   rendering outright, because the runner stage never carried the variable — SSR fell
#   back to the same-origin path and hit the unreachable default rewrite target,
#   filling the log with ECONNREFUSED 127.0.0.1:8102 on every render.

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # Published for direct API access and debugging. The frontend does NOT use this
      # route — it reaches the backend over the compose network as http://backend:8000.
      - "8000:8000"
    environment:
      PORT: "8000"
    env_file:
      - .env
    volumes:
      # Persist uploaded policy documents across container restarts.
      - ./backend/policies:/app/backend/policies
      # Persist the store: observations captured hourly, and — the reason this matters —
      # the case decisions that are the audit trail. Without it every `up` discarded
      # every approval and rejection ever recorded.
      #
      # A NAMED VOLUME, NOT A BIND MOUNT. SQLite in WAL mode needs real file locking,
      # which Docker Desktop's Windows/macOS bind mounts do not reliably provide; the
      # symptom is an intermittent "database is locked" or "disk I/O error" under
      # concurrent reads. Docker seeds a named volume from the image on first use, so
      # the backfilled database baked into the image is still there on first start.
      - aree-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Empty on purpose: the browser talks to this server's own origin and the
        # rewrite below forwards it. See the note at the top of this file.
        NEXT_PUBLIC_API_URL: ""
        # BUILD arg, not just runtime. Next freezes rewrite destinations into
        # .next/routes-manifest.json during `next build`, so a value supplied only to
        # the running container is ignored. Service name, not localhost — inside this
        # container localhost is the frontend itself.
        AREE_API_ORIGIN: "http://backend:8000"
        # From the root .env, which compose interpolates automatically. The frontend
        # still has no env_file — this is one named, public basemap key passed
        # explicitly, not the secret set. Absent from .env it resolves to empty and
        # the maps render watermarked instead of failing.
        NEXT_PUBLIC_CARTO_KEY: "${NEXT_PUBLIC_CARTO_KEY:-}"
    environment:
      # Kept in the runtime environment too: next.config.ts is still evaluated at
      # startup for its other options, and this keeps the two readings consistent.
      AREE_API_ORIGIN: "http://backend:8000"
    ports:
      - "3000:3000"
    depends_on:
      backend:
        # The engine takes a while to load its models, and the frontend prerenders its
        # static pages on boot. Waiting for healthy means that prerender has an API to
        # talk to instead of failing and leaving the first paint empty.
        condition: service_healthy
    healthcheck:
      # node:22-slim ships neither curl nor wget; Node 22 has global fetch.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  aree-data:
