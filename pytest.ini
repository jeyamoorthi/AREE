[pytest]
# Tests live under backend/tests/. Rootdir is the repository root because the
# application is run as `uvicorn backend.api.main:api` from here, and the flat
# imports inside backend/ (`from config import ...`) resolve against a sys.path
# entry that conftest.py adds.
testpaths = backend/tests
python_files = test_*.py
addopts = -q --strict-markers --tb=short
markers =
    network: needs live upstream feeds (CPCB / CAQM / Open-Meteo / FIRMS).
             Excluded from the offline gate with -m "not network".
filterwarnings =
    ignore::DeprecationWarning
